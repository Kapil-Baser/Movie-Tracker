name: Build the Movie Tracker App

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Creating the required env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Setting up the JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Testing
        run: mvn -B test
        
      - name: Listing files
        run: tree
