name: Run tests

on: workflow_dispatch

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setting up the JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Running Tests
        run: mvn -B test

  build-and-deploy:
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setting up the JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Building the JAR file
        run: mvn -B clean package -DskipTests

        
      - name: Transferring JAR to VPS
        uses: nogsantos/ssh-scp-deploy@v1.3.0
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          src: ./target/*.jar
          remote: ./target/movie-tracker.jar

      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd movie_tracker
            rm movie-tracker-old.jar
            mv movie-tracker.jar movie-tracker-old.jar
            mv /home/${{ secrets.VPS_USER }}/target/movie-tracker.jar .
            sudo systemctl restart movie-tracker.service
        
