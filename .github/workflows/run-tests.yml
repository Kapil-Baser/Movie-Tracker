name: Run tests

on: workflow_dispatch

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setting up the JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Running Tests
        run: mvn -B test
