
# Database configuration
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${SPRING_DATASOURCE_POSTGRESQL_URL_SCHEMA}
spring.datasource.username=${SPRING_DATASOURCE_POSTGRESQL_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_POSTGRESQL_PASSWORD}
spring.jpa.properties.hibernate.default_schema=movie_tracker_schema
#spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=src/main/resources/db/migration/V1__initial_schema.sql

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=movie_tracker_schema

# Google login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email, https://www.googleapis.com/auth/calendar, openid
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
#spring.security.oauth2.client.registration.google.client-authentication-method=client_secret_basic
#spring.security.oauth2.client.registration.google.authorization-parameters.prompt=consent
#spring.security.oauth2.client.registration.google.authorization-parameters.access_type=offline

# Mail properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Logging
logging.file.name=/var/log/movie-tracker/app.log
logging.level.org.springframework.security=INFO

#Quartz Scheduler
spring.quartz.job-store-type=jdbc
# Disable the quartz schema initialization since I am using Flyway for that
spring.quartz.jdbc.initialize-schema=never

#Spring Session
spring.session.jdbc.initialize-schema=never
spring.session.timeout=7d
spring.session.store-type=jdbc