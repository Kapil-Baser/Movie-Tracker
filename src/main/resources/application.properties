spring.application.name=movie-tracker
spring.profiles.active=prod

# Reject any multipart request instantly
spring.servlet.multipart.enabled=false

# Database configuration
#spring.datasource.url=${SPRING_DATASOURCE_POSTGRESQL_URL}
#spring.datasource.username=${SPRING_DATASOURCE_POSTGRESQL_USERNAME}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.json_format_mapper=com.example.movieapi.utility.CustomHibernateJsonFormatter

spring.config.import=optional:file:.env[.properties]

# Mail properties
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=${SUPPORT_EMAIL:dummy_email@google.com}
spring.mail.password=${APP_PASSWORD:dummy_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# TMDB API Key
tmdb.api.key=${TMDB_API_KEY:tmdb_dummy_key}
tmdb.base.url=https://api.themoviedb.org/3

# MdbList
mdblist.api.key=${MDBLIST_API_KEY:mdblist_dummy_key}
mdblist.base.url=https://api.mdblist.com

# Trakt.tv API
trakt.api.key=${TRAKT_API_KEY:trakt_dummy_key}
trakt.client=${CLIENT_ID:trakt_client_id}
trakt.base.url=https://api.trakt.tv

# Logging
logging.level.root=INFO
#logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
#logging.level.org.springframework.security.oauth2=TRACE

#Quartz Scheduler
#org.quartz.jobStore.class=org.quartz.simpl.RAMJobStore

# Configure Quartz JDBC Store
#spring.quartz.job-store-type=jdbc
spring.quartz.overwrite-existing-jobs=true
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate